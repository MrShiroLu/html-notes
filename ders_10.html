<!DOCTYPE html>
<html>
    <head>
        <style>
            table {
              border-collapse: collapse;
              width: 100%;
            }
            
            th, td {
              text-align: left;
              padding: 8px;
            }
            
            tr:nth-child(even) {
              background-color: #D6EEEE;
            }
            tr:nth-child(even) {
                background-color: rgba(150, 212, 212, 0.4);
            }

                th:nth-child(even),td:nth-child(even) {
                background-color: rgba(150, 212, 212, 0.4);
            }
            tr:hover{background-color: blue;}

            </style>
        <title>yasamak istemiyorum</title>
        <link rel="icon" href="casio-g-shock-seeklogo-4.svg">

    </head>
    <body>

        <h2>Zebra Striped Table</h2>
        <p>For zebra-striped tables, use the nth-child() selector and add a background-color to all even (or odd) table rows:</p>
        
        <table>
            <colgroup>
            <col span="1" style="background-color: red;">
            <col span="2" style="background-color: bisque;">
        </colgroup>
          <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Points</th>
          </tr>
          <tr>
          <td>Peter</td>
          <td>Griffin</td>
          <td>$100</td>
          </tr>
          <tr>
          <td>Lois</td>
          <td>Griffin</td>
          <td>$150</td>
          </tr>
          <tr>
          <td>Joe</td>
          <td>Swanson</td>
          <td>$300</td>
          </tr>
          <tr>
          <td>Cleveland</td>
          <td>Brown</td>
          <td>$250</td>
          </tr>
        </table>
        
        </body>
</html>
